<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome - File Library</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
color:white;
background:#000;
overflow-x:hidden;
}

#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-1;
}

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:40px;
}

.card-box{
background:rgba(0,0,0,0.55);
backdrop-filter:blur(10px);
border-radius:20px;
padding:40px;
max-width:700px;
margin:auto;
box-shadow:0 0 40px rgba(0,0,0,0.5);
animation:fadeIn 1.5s ease;
}

.title{
font-size:40px;
font-weight:600;
margin-bottom:20px;
}

.subtitle{
font-size:18px;
opacity:0.9;
margin-bottom:30px;
}

.feature{
margin:10px 0;
font-size:17px;
}

.icon{
color:#00d9ff;
margin-right:10px;
}

.btn-custom{
background:#00d9ff;
border:none;
padding:12px 30px;
border-radius:30px;
font-weight:600;
transition:0.3s;
}

.btn-custom:hover{
background:#00b8d4;
transform:scale(1.05);
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.footer{
margin-top:30px;
font-size:14px;
opacity:0.7;
}

</style>

</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">

<div class="card-box">

<div class="title">
<i class="fa-solid fa-cloud-arrow-down icon"></i>
Welcome to the File Library
</div>

<div class="subtitle">
A simple space to browse, preview, and download files easily.
</div>

<div class="feature">
<i class="fa-solid fa-folder-open icon"></i>
Browse files in one place
</div>

<div class="feature">
<i class="fa-solid fa-play icon"></i>
Preview videos, audio, images and PDFs
</div>

<div class="feature">
<i class="fa-solid fa-download icon"></i>
Download files instantly
</div>

<div class="feature">
<i class="fa-solid fa-mobile-screen icon"></i>
Works on all devices
</div>

<br>

<a href="/" class="btn btn-custom">
<i class="fa-solid fa-folder"></i>
Open File Library
</a>

<div class="footer">
Uploaded and maintained by the administrator.
</div>

</div>

</div>


<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
canvas:document.getElementById('bg'),
alpha:true
});

renderer.setSize(window.innerWidth,window.innerHeight);

camera.position.z=5;

const geometry = new THREE.BufferGeometry();

const vertices = [];

for(let i=0;i<5000;i++){

vertices.push(
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000,
(Math.random()-0.5)*2000
);

}

geometry.setAttribute(
'position',
new THREE.Float32BufferAttribute(vertices,3)
);

const material = new THREE.PointsMaterial({
color:0x00d9ff,
size:1
});

const stars = new THREE.Points(geometry,material);

scene.add(stars);

function animate(){

requestAnimationFrame(animate);

stars.rotation.y += 0.0005;

renderer.render(scene,camera);

}

animate();

window.addEventListener('resize',()=>{

camera.aspect = window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
